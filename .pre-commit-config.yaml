exclude: |
  (?x)
  (LICENSE.*|LICENSE)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v3.4.0
    hooks:
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: bibtex-tidy
        name: bibtex-tidy
        language: node
        additional_dependencies: [bibtex-tidy@1.15.1]
        entry: bibtex-tidy --modify --curly --numeric --months --space=2 --align=14 --blank-lines --trailing-commas --remove-empty-fields --no-escape --strip-enclosing-braces --duplicates=key,doi
        files: ^_bibliography/.*\.bib$
