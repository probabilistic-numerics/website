- id: ode
  label: ODEs
  description: >
    There are two common ways in which probabilistic methods are used in
    combination with ordinary differential equations. The "classic" problem of
    numerics is to infer the solution to an initial value problem given access
    to the differential equation (tag "Solving ODEs"). The reverse problem has
    also found interest in machine learning: inferring a differential equation
    from (noisy) observations of trajectories that are assumed to be governed by
    this ODE (tag "Inferring ODEs").
- id: ode-solving
  label: Solving ODEs
- id: ode-inference
  label: Inferring ODEs
